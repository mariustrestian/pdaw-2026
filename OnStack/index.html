<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OnStack Text Editor</title>
  <link rel="icon" href="img/onstack_rabbit_logo.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <div class="brand-actions">
      <a class="logo" href="#" aria-label="OnStack home" title="Back to top">
        <img class="logo-img" src="img/onstack_rabbit_logo.svg"
             alt="" width="40" height="40">
      </a>
      <button id="restore-defaults" class="header-action" type="button"
              aria-label="Restore defaults" title="Restore default editor settings and clear the document">
        <img class="header-action-icon" src="img/full_reset_icon.svg" alt="" width="20" height="20">
      </button>
      <button id="save-file" class="header-action" type="button"
              aria-label="Save file" title="Download this document as an HTML file">
        <img class="header-action-icon" src="img/download_icon.svg" alt="" width="20" height="20">
      </button>
      <span class="brand-divider" aria-hidden="true"></span>
      <button id="find-toggle" class="header-action" type="button"
              aria-label="Find and replace" title="Find and replace (Ctrl/Cmd+F)">
        <svg class="header-action-icon" viewBox="0 0 24 24" aria-hidden="true" fill="none"
             stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <circle cx="10.5" cy="10.5" r="6.5"></circle>
          <line x1="15.5" y1="15.5" x2="21" y2="21"></line>
        </svg>
      </button>
      <button id="details-toggle" class="header-action" type="button"
              aria-label="Document details" title="Document details">
        <svg class="header-action-icon" viewBox="0 0 24 24" aria-hidden="true"
             fill="none" stroke="currentColor" stroke-width="2"
             stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="9"></circle>
          <line x1="12" y1="11" x2="12" y2="17"></line>
          <circle cx="12" cy="7.5" r="0.9" fill="currentColor" stroke="none"></circle>
        </svg>
      </button>
      <button id="copy-document" class="header-action" type="button"
              aria-label="Copy document to clipboard" title="Copy document to clipboard">
        <svg class="header-action-icon" viewBox="0 0 24 24" aria-hidden="true"
             fill="none" stroke="currentColor" stroke-width="2"
             stroke-linecap="round" stroke-linejoin="round">
          <rect x="9" y="9" width="11" height="12" rx="1.5"></rect>
          <path d="M5 15V4.5A1.5 1.5 0 0 1 6.5 3H15"></path>
        </svg>
      </button>
    </div>

    <div class="header-controls">
      <div class="font-family-control">
        <button id="font-family-toggle" type="button"
                aria-label="Choose font family" title="Choose font family"
                aria-expanded="false" aria-haspopup="menu"
                aria-controls="font-family-menu">T</button>
        <div id="font-family-menu" class="font-family-menu"
             role="menu" aria-label="Font family"></div>
      </div>

      <div class="text-color-control" aria-label="Text color">
        <input id="text-color" type="color" value="#000000"
               aria-label="Choose text color" title="Text color">
        <input id="text-opacity" type="range" min="0" max="100" value="100"
               aria-label="Text opacity" title="Text opacity">
        <span class="opacity-value" id="opacity-value">100%</span>
      </div>

      <label class="highlight-color-control" title="Highlight color">
        <span class="sr-only">Highlight color</span>
        <input id="highlight-color" type="color" value="#ffe066"
               aria-label="Choose highlight color">
      </label>

      <label class="background-color-control">
        <span class="sr-only">Background color</span>
        <input id="background-color" type="color" value="#ffffff"
               aria-label="Choose background color" title="Background color">
      </label>

      <div class="font-size-control" aria-label="Font size">
        <button id="decrease-font" type="button"
                aria-label="Decrease font size"
                title="Decrease 1px. Alt + -; hold Shift for 5px.">
          <span class="font-size-icon">−</span>
        </button>
        <input class="font-size-value" id="font-size-value" type="number"
               min="2" max="160" value="24"
               aria-label="Font size in pixels" title="Font size in pixels">
        <button id="increase-font" type="button"
                aria-label="Increase font size"
                title="Increase 1px. Alt + = or +; hold Shift for 5px.">
          <span class="font-size-icon">+</span>
        </button>
      </div>

      <button id="theme-toggle" type="button"
              aria-label="Switch to dark theme" title="Switch to dark theme"
              aria-pressed="false">
        <svg viewBox="0 0 32 32" aria-hidden="true">
          <circle cx="16" cy="16" r="6"></circle>
          <path class="sun-rays"
                d="M16 2v5M16 25v5M2 16h5M25 16h5M6.1 6.1l3.5 3.5M22.4 22.4l3.5 3.5M25.9 6.1l-3.5 3.5M9.6 22.4l-3.5 3.5"></path>
        </svg>
      </button>
    </div>

    <div id="find-bar" class="find-bar" role="search" aria-label="Find and replace" aria-hidden="true">
      <input id="find-input" type="text" placeholder="Find" aria-label="Find" autocomplete="off" spellcheck="false">
      <span class="find-count" id="find-count">0/0</span>
      <button id="find-prev" type="button" aria-label="Previous match" title="Previous match (Shift+Enter)">↑</button>
      <button id="find-next" type="button" aria-label="Next match" title="Next match (Enter)">↓</button>
      <span class="find-divider" aria-hidden="true"></span>
      <input id="replace-input" type="text" placeholder="Replace" aria-label="Replace with" autocomplete="off" spellcheck="false">
      <button id="replace-one" type="button" title="Replace current match">Replace</button>
      <button id="replace-all" type="button" title="Replace all matches">All</button>
      <button id="find-close" type="button" aria-label="Close find bar" title="Close (Esc)">×</button>
    </div>
  </header>

  <main>
    <div id="content" class="is-empty" contenteditable="true"
         role="textbox" aria-multiline="true" aria-label="Text"></div>
  </main>

  <div id="selection-panel" class="selection-panel"
       role="toolbar" aria-label="Text formatting" aria-hidden="true">
    <button type="button" data-style-property="font-weight" data-style-value="700"
            aria-label="Bold" aria-keyshortcuts="Control+B Meta+B"
            title="Bold (Ctrl/Cmd+B)">B</button>
    <button type="button" data-style-property="font-style" data-style-value="italic"
            aria-label="Italic" aria-keyshortcuts="Control+I Meta+I"
            title="Italic (Ctrl/Cmd+I)">I</button>
    <button type="button" data-style-property="text-decoration-line" data-style-value="underline"
            aria-label="Underline" aria-keyshortcuts="Control+U Meta+U"
            title="Underline (Ctrl/Cmd+U)">U</button>
    <button type="button" data-style-property="text-decoration-line" data-style-value="line-through"
            aria-label="Strikethrough" aria-keyshortcuts="Control+Shift+X Meta+Shift+X"
            title="Strikethrough (Ctrl/Cmd+Shift+X)">S</button>
    <button type="button" id="alignment-button"
            aria-label="Text alignment" title="Text alignment"
            aria-haspopup="menu" aria-expanded="false"
            aria-controls="alignment-menu">
      <svg viewBox="0 0 16 16" aria-hidden="true">
        <rect x="1" y="2"    width="14" height="1.8" rx="0.9"/>
        <rect x="1" y="5.4"  width="10" height="1.8" rx="0.9"/>
        <rect x="1" y="8.8"  width="14" height="1.8" rx="0.9"/>
        <rect x="1" y="12.2" width="8"  height="1.8" rx="0.9"/>
      </svg>
    </button>
    <span class="selection-divider" aria-hidden="true"></span>
    <button type="button" id="clear-formatting"
            aria-label="Clear formatting" aria-keyshortcuts="Control+\ Meta+\"
            title="Clear formatting (Ctrl/Cmd+\)">
      <svg viewBox="0 0 16 16" aria-hidden="true">
        <path d="M3.2 3h9.6v1.8H9.6V12H7.4V4.8H3.2Z"/>
        <line x1="2.4" y1="13.4" x2="13.6" y2="13.4"
              stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
      </svg>
    </button>
  </div>

  <div id="alignment-menu" class="alignment-menu"
       role="menu" aria-label="Text alignment" aria-hidden="true">
    <button type="button" role="menuitemradio" data-alignment="left"
            aria-checked="false" aria-label="Align left" title="Align left">
      <svg viewBox="0 0 16 16" aria-hidden="true">
        <rect x="1" y="2"    width="14" height="1.8" rx="0.9"/>
        <rect x="1" y="5.4"  width="10" height="1.8" rx="0.9"/>
        <rect x="1" y="8.8"  width="14" height="1.8" rx="0.9"/>
        <rect x="1" y="12.2" width="8"  height="1.8" rx="0.9"/>
      </svg>
      <span>Left</span>
    </button>
    <button type="button" role="menuitemradio" data-alignment="center"
            aria-checked="false" aria-label="Align center" title="Align center">
      <svg viewBox="0 0 16 16" aria-hidden="true">
        <rect x="1" y="2"    width="14" height="1.8" rx="0.9"/>
        <rect x="3" y="5.4"  width="10" height="1.8" rx="0.9"/>
        <rect x="1" y="8.8"  width="14" height="1.8" rx="0.9"/>
        <rect x="4" y="12.2" width="8"  height="1.8" rx="0.9"/>
      </svg>
      <span>Center</span>
    </button>
    <button type="button" role="menuitemradio" data-alignment="right"
            aria-checked="false" aria-label="Align right" title="Align right">
      <svg viewBox="0 0 16 16" aria-hidden="true">
        <rect x="1" y="2"    width="14" height="1.8" rx="0.9"/>
        <rect x="5" y="5.4"  width="10" height="1.8" rx="0.9"/>
        <rect x="1" y="8.8"  width="14" height="1.8" rx="0.9"/>
        <rect x="7" y="12.2" width="8"  height="1.8" rx="0.9"/>
      </svg>
      <span>Right</span>
    </button>
    <button type="button" role="menuitemradio" data-alignment="justify"
            aria-checked="false" aria-label="Justify" title="Justify">
      <svg viewBox="0 0 16 16" aria-hidden="true">
        <rect x="1" y="2"    width="14" height="1.8" rx="0.9"/>
        <rect x="1" y="5.4"  width="14" height="1.8" rx="0.9"/>
        <rect x="1" y="8.8"  width="14" height="1.8" rx="0.9"/>
        <rect x="1" y="12.2" width="8"  height="1.8" rx="0.9"/>
      </svg>
      <span>Justify</span>
    </button>
  </div>

  <div id="details-overlay" class="details-overlay"
       role="dialog" aria-modal="true" aria-labelledby="details-title"
       aria-hidden="true">
    <div class="details-dialog">
      <div class="details-dialog-header">
        <h2 id="details-title">Document Details</h2>
        <button id="details-close" type="button" class="details-close"
                aria-label="Close details">×</button>
      </div>
      <dl class="details-list" id="details-list"></dl>
    </div>
  </div>

  <div id="status" class="sr-only" role="status" aria-live="polite" aria-atomic="true"></div>

  <script src="app.js"></script>
</body>
</html>
