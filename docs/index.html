<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OnStack Text Editor</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <div class="brand-actions">
      <a class="logo" href="#">OnStack</a>
      <button id="restore-defaults" class="header-action" type="button" title="Restore default editor settings">Restore Defaults</button>
      <button id="save-file" class="header-action" type="button" title="Download this document as an HTML file">Save File</button>
    </div>
    <div class="header-controls">
      <div class="font-family-control">
        <button id="font-family-toggle" type="button" aria-label="Choose font family" title="Choose font family" aria-expanded="false">T</button>
        <div id="font-family-menu" class="font-family-menu" role="listbox" aria-label="Font family"></div>
      </div>
      <div class="text-color-control" aria-label="Text color">
        <input id="text-color" type="color" value="#000000" aria-label="Choose text color" title="Text color">
        <input id="text-opacity" type="range" min="0" max="100" value="100" aria-label="Text opacity" title="Text opacity">
        <span class="opacity-value" id="opacity-value">100%</span>
      </div>
      <label class="background-color-control">
        <span class="sr-only">Background color</span>
        <input id="background-color" type="color" value="#ffffff" aria-label="Choose background color" title="Background color">
      </label>
      <div class="font-size-control" aria-label="Font size">
        <button id="decrease-font" type="button" aria-label="Decrease font size" title="Decrease 1px. Alt + -; hold Shift for 5px."><span class="font-size-icon">−</span></button>
        <input class="font-size-value" id="font-size-value" type="number" min="2" max="160" value="24" aria-label="Font size in pixels" title="Font size in pixels">
        <button id="increase-font" type="button" aria-label="Increase font size" title="Increase 1px. Alt + = or +; hold Shift for 5px."><span class="font-size-icon">+</span></button>
      </div>
      <button id="theme-toggle" type="button" aria-label="Switch to dark theme" title="Switch to dark theme" aria-pressed="false">
        <svg viewBox="0 0 32 32" aria-hidden="true">
          <circle cx="16" cy="16" r="6"></circle>
          <path class="sun-rays" d="M16 2v5M16 25v5M2 16h5M25 16h5M6.1 6.1l3.5 3.5M22.4 22.4l3.5 3.5M25.9 6.1l-3.5 3.5M9.6 22.4l-3.5 3.5"></path>
        </svg>
      </button>
    </div>
  </header>

  <main>
    <div id="content" contenteditable="true" role="textbox" aria-multiline="true" aria-label="Text"></div>
  </main>

  <div id="selection-panel" class="selection-panel" role="toolbar" aria-label="Text formatting" aria-hidden="true">
    <button type="button" data-style-property="font-weight" data-style-value="700" aria-label="Bold" title="Bold">B</button>
    <button type="button" data-style-property="font-style" data-style-value="italic" aria-label="Italic" title="Italic">I</button>
    <button type="button" data-style-property="text-decoration-line" data-style-value="underline" aria-label="Underline" title="Underline">U</button>
    <button type="button" data-style-property="text-decoration-line" data-style-value="line-through" aria-label="Strikethrough" title="Strikethrough">S</button>
  </div>

  <script src="app.js"></script>
</body>
</html>
